server {
    listen 80;
    server_name _;

    # Không lộ phiên bản nginx trong header / trang lỗi
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # API chỉ nhận JSON nhỏ (backend giới hạn 100kb), chặn sớm các request quá lớn
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Header bảo mật -------------------------------------------------------------------------
    # Token đăng nhập nằm trong sessionStorage nên CSP chặt (script chỉ chạy từ chính site này) là lớp phòng thủ
    # quan trọng nếu có lỗ hổng XSS. Phông chữ lấy từ Google Fonts (xem index.html) nên được cho phép riêng.
    # Lưu ý: add_header ở cấp server chỉ áp dụng cho location KHÔNG tự khai báo add_header — nếu sau này thêm
    # add_header vào một location (ví dụ cache), phải lặp lại các header dưới đây trong location đó.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Dùng DNS nội bộ của Docker (luôn là 127.0.0.11) và biến $backend_upstream để nginx
    # phân giải tên "backend" ngay khi có request, thay vì lúc khởi động (tránh lỗi
    # "host not found in upstream" nếu container backend chưa kịp sẵn sàng trước frontend).
    resolver 127.0.0.11 valid=10s;

    # Chuyển tiếp mọi request /api sang service backend trong docker-compose
    location /api/ {
        set $backend_upstream backend:4000;
        proxy_pass http://$backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: mọi route khác trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
